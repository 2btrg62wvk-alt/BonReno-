<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Projeko · Profil entrepreneur</title>
<style>
:root{--ink:#202322;--muted:#727773;--line:#e8ebe8;--paper:#f5f6f3;--accent:#896a36;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.app{max-width:520px;min-height:100dvh;margin:auto;background:#fff;padding-top:env(safe-area-inset-top)}.preview{padding:7px 24px;background:var(--paper);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.preview span:last-child{color:var(--accent)}header{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.97);height:70px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line)}header span{flex:1;font-size:14px;font-weight:550}header a{width:32px;height:36px;display:grid;place-items:center}.edit{font-size:12px;font-weight:600;color:var(--accent);padding:10px 0;text-align:right;max-width:145px}.cover{height:180px;position:relative;background:#e9ece6;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block;object-position:50% 50%}.cover.blank{background:linear-gradient(130deg,#e7eae3,#f1f2ef)}.cover.blank::before{content:'';position:absolute;inset:30px;border:1px solid #d6dbd1}.cover.blank::after{content:'Votre photo de couverture';position:absolute;left:24px;bottom:20px;font-size:12px;color:#6d7569}.cover-tools{position:absolute;right:15px;bottom:15px;z-index:1}.upload{display:inline-block;padding:8px 12px;background:white;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer}.upload input{display:none}.main{padding:0 24px 30px}.identity{display:flex;gap:15px;align-items:flex-end;margin-top:-23px;position:relative}.logo{width:68px;height:68px;border:4px solid white;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:20px;font-weight:650;overflow:hidden;flex-shrink:0}.logo img{width:100%;height:100%;object-fit:cover}.location{font-size:12px;color:var(--muted);padding-bottom:4px}.name{font-size:29px;line-height:1.15;letter-spacing:-.8px;font-weight:650;margin:18px 0 8px}.tagline{font-size:15px;color:var(--muted);margin:0;line-height:1.6}.summary{display:flex;gap:22px;margin:23px 0 27px}.summary p{font-size:11px;color:var(--muted);margin:0}.summary strong{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:2px}.section{padding:24px 0;border-top:1px solid var(--line)}h2{font-size:17px;letter-spacing:-.3px;font-weight:650;margin:0 0 13px}p{margin:0}.bodycopy{font-size:14px;line-height:1.8;color:#575e58}.sectionhead{display:flex;align-items:baseline;justify-content:space-between}.sectionhead span{font-size:12px;color:var(--muted)}.services{display:flex;gap:8px;flex-wrap:wrap}.service{border:1px solid var(--line);border-radius:5px;padding:6px 9px;font-size:12px}.empty{color:var(--muted);font-size:13px;line-height:1.7}.empty .add{color:var(--accent);font-weight:550;padding:10px 0;margin-top:6px}.professional{font-size:13px;display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.professional span{color:var(--muted)}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.footer{display:flex;align-items:center;gap:7px;padding:24px 0;color:#8b918b;font-size:12px}.footer img{width:20px;height:20px}.field{display:block;font-size:12px;font-weight:550;margin:18px 0}.field input,.field textarea{display:block;width:100%;border:1px solid #dce1d9;background:#fff;border-radius:6px;padding:11px 12px;margin-top:7px;font-size:14px;font-weight:400}.field textarea{min-height:100px;resize:vertical}.field input[type=range]{padding:0;border:0;accent-color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:var(--ink);color:white;border-radius:7px;padding:13px 18px;font-size:14px;width:100%;margin-top:14px}.outline{border:1px solid var(--line);padding:10px 14px;font-size:12px;border-radius:6px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.danger{color:#a0493d;font-size:12px}.work{margin-bottom:20px}.work img{width:100%;height:180px;object-fit:cover;border-radius:6px;display:block;margin-bottom:10px}.work strong{font-size:14px;font-weight:550}.work small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:#fff;padding:12px 16px;border-radius:7px;font-size:12px;z-index:4;display:none}.toast.show{display:block}.errors{color:#a0493d;font-size:12px;margin:12px 0}.editing .main{padding-top:10px}button:active{opacity:.6}@media(min-width:700px){.app{margin:32px auto;border:1px solid var(--line);border-radius:18px;overflow:clip;min-height:calc(100dvh - 64px)}}@media(max-width:360px){header,.main{padding-left:18px;padding-right:18px}.edit{max-width:130px;font-size:11px}.name{font-size:26px}}
</style></head><body><div class="app" id="app"><div class="preview"><span>Profil · aperçu</span><span>Sauvegarde sur cet appareil</span></div><header><a href="/presentation/menu-projeko" aria-label="Retour au menu"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></a><span>Mon entreprise</span><button class="edit" id="edit">Modifier</button></header><div id="view"></div></div><div class="toast" id="toast" role="status"></div>
<script>
const key='projeko-design-profile-v1',initial={name:'Entreprise Test',city:'Montréal',tagline:'Des travaux bien faits, du début à la fin.',bio:'Présentez ici votre équipe et votre façon de travailler. Quelques phrases suffisent pour aider un client à vous connaître.',services:'Rénovation générale',radius:50,rbq:'',insured:false,cover:'',logo:'',crop:50,works:[]};let profile=structuredClone(initial),draft,editing=false,timer;try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.name==='string')profile={...initial,...saved,works:Array.isArray(saved.works)?saved.works:[]}}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeImage=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)?s:'';const view=document.getElementById('view'),edit=document.getElementById('edit');
function cover(p){return `<div class="cover ${safeImage(p.cover)?'':'blank'}">${safeImage(p.cover)?`<img id="coverImage" src="${p.cover}" alt="Couverture de l’entreprise" style="object-position:50% ${Number(p.crop)||50}%">`:''}${editing?'<div class="cover-tools"><label class="upload">Modifier la couverture<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label></div>':''}</div>`}
function render(){document.getElementById('app').classList.toggle('editing',editing);edit.textContent=editing?'Sauvegarder les changements':'Modifier';const p=editing?draft:profile;
if(editing){view.innerHTML=cover(p)+`<form id="form" class="main"><p class="note">Ces changements sont enregistrés dans l’aperçu uniquement.</p>${safeImage(p.cover)?`<label class="field">Cadrage de la couverture<input id="crop" type="range" min="0" max="100" value="${Number(p.crop)||50}"></label><button type="button" class="danger" data-remove-cover>Retirer la couverture</button>`:''}<label class="field">Logo de l’entreprise<label class="upload" style="display:table;margin-top:8px">Choisir un logo<input id="logoFile" type="file" accept="image/jpeg,image/png,image/webp"></label></label><label class="field">Nom de l’entreprise<input name="name" value="${esc(p.name)}" maxlength="90" required></label><label class="field">Votre phrase de présentation<input name="tagline" value="${esc(p.tagline)}" maxlength="160"></label><label class="field">À propos<textarea name="bio" maxlength="1200">${esc(p.bio)}</textarea></label><div class="twocol"><label class="field">Ville<input name="city" value="${esc(p.city)}" maxlength="60" required></label><label class="field">Rayon (km)<input name="radius" type="number" min="1" max="500" value="${Number(p.radius)||50}" required></label></div><label class="field">Services (séparés par une virgule)<input name="services" value="${esc(p.services)}" maxlength="300"></label><label class="field">Licence RBQ déclarée<input name="rbq" value="${esc(p.rbq)}" maxlength="30"></label><label class="field"><input name="insured" type="checkbox" ${p.insured?'checked':''} style="display:inline;width:auto;margin-right:8px">Assurance responsabilité déclarée</label><div class="section"><h2>Réalisations</h2>${workList(p,true)}<label class="field">Titre de la réalisation<input id="workTitle" maxlength="100" placeholder="Ex. Cuisine à Laval"></label><label class="upload">Ajouter une photo<input id="workFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="note">Indiquez un titre, puis choisissez une photo.</p></div><div class="errors" id="errors" role="alert"></div><button class="primary" type="submit">Sauvegarder les changements</button><div class="actions"><button class="outline" type="button" data-cancel>Annuler</button></div></form>`;return}
const services=String(p.services).split(',').map(s=>s.trim()).filter(Boolean);view.innerHTML=cover(p)+`<div class="main"><div class="identity"><div class="logo">${safeImage(p.logo)?`<img src="${p.logo}" alt="Logo de l’entreprise">`:'ET'}</div><p class="location">${esc(p.city)}, QC</p></div><h1 class="name">${esc(p.name)}</h1><p class="tagline">${esc(p.tagline)}</p><div class="summary"><p><strong>${services.length}</strong>${services.length>1?'services':'service'}</p><p><strong>${Number(p.radius)||50} km</strong>rayon de service</p><p><strong>${p.works.length}</strong>${p.works.length>1?'réalisations':'réalisation'}</p></div><section class="section"><h2>À propos</h2><p class="bodycopy" style="white-space:pre-line">${esc(p.bio)}</p></section><section class="section"><h2>Services</h2><div class="services">${services.map(s=>`<span class="service">${esc(s)}</span>`).join('')||'<p class="empty">Ajoutez les services que vous offrez.</p>'}</div></section><section class="section"><div class="sectionhead"><h2>Réalisations</h2><span>${p.works.length}</span></div>${p.works.length?workList(p,false):'<div class="empty"><p>Vos travaux parlent pour vous.<br>Ajoutez une première réalisation pour montrer ce que vous faites.</p><button class="add" data-edit>Ajouter une réalisation →</button></div>'}</section><section class="section"><h2>Territoire</h2><p class="bodycopy">${esc(p.city)} et les environs, dans un rayon de ${Number(p.radius)||50} km.</p></section><section class="section"><h2>Informations professionnelles</h2><div class="professional"><span>Licence RBQ</span><b>${esc(p.rbq)||'À renseigner'}</b></div><div class="professional"><span>Assurance responsabilité</span><b>${p.insured?'Déclarée':'À renseigner'}</b></div><p class="note">Informations déclarées par l’entreprise, non vérifiées par Projeko.</p></section><div class="footer"><img src="/icons/apple-touch-icon-projeko-v3.png" alt="">Votre entreprise sur Projeko</div></div>`}
function workList(p,editable){return p.works.map((w,i)=>`<article class="work">${safeImage(w.photo)?`<img src="${w.photo}" alt="${esc(w.title)}">`:''}<strong>${esc(w.title)}</strong>${editable?`<button type="button" class="danger" data-delete-work="${i}" style="display:block;margin-top:7px">Retirer</button>`:''}</article>`).join('')}
function begin(){draft=structuredClone(profile);editing=true;render()}
function sync(){if(!editing)return;const f=document.getElementById('form');for(const n of ['name','tagline','bio','city','services','rbq'])draft[n]=f.elements[n].value;draft.radius=Number(f.elements.radius.value);draft.insured=f.elements.insured.checked;const c=document.getElementById('crop');if(c)draft.crop=Number(c.value)}
function notify(s){clearTimeout(timer);const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');timer=setTimeout(()=>t.classList.remove('show'),3500)}
function save(){sync();const f=document.getElementById('form');if(!f.reportValidity())return;if(!draft.name.trim()||!draft.city.trim()){document.getElementById('errors').textContent='Indiquez le nom de l’entreprise et la ville.';return}draft.name=draft.name.trim();draft.city=draft.city.trim();try{localStorage.setItem(key,JSON.stringify(draft))}catch{document.getElementById('errors').textContent='Impossible d’enregistrer sur cet appareil. Retirez une photo ou libérez de l’espace.';return}profile=structuredClone(draft);editing=false;render();notify('Tous les changements de cet aperçu sont sauvegardés.')}
edit.addEventListener('click',()=>editing?save():begin());view.addEventListener('submit',e=>{e.preventDefault();save()});view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-edit'))begin();if(b.hasAttribute('data-cancel')){editing=false;render()}if(b.hasAttribute('data-remove-cover')){sync();draft.cover='';render()}if(b.hasAttribute('data-delete-work')){sync();draft.works.splice(Number(b.dataset.deleteWork),1);render()}});
view.addEventListener('input',e=>{if(e.target.id==='crop'){draft.crop=Number(e.target.value);document.getElementById('coverImage').style.objectPosition=`50% ${draft.crop}%`}});
view.addEventListener('change',async e=>{const kind=e.target.id;if(!['coverFile','logoFile','workFile'].includes(kind))return;const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){notify('Choisissez une image JPG, PNG ou WebP de moins de 5 Mo.');return}sync();const title=document.getElementById('workTitle').value.trim();if(kind==='workFile'&&!title){notify('Ajoutez un titre à la réalisation.');e.target.value='';return}const capturedDraft=draft;try{const src=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});if(!editing||draft!==capturedDraft)return;if(kind==='coverFile'){draft.cover=src;draft.crop=50}else if(kind==='logoFile')draft.logo=src;else draft.works.push({title,photo:src});render()}catch{notify('Cette photo n’a pas pu être chargée.')}});render();
</script></body></html>
