<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Projeko · Aperçu du menu</title>
<style>
:root{color-scheme:light;--ink:#202322;--muted:#737875;--line:#e8ebe8;--accent:#896a36;--paper:#f5f6f3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:520px;background:#fff;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.preview{background:var(--paper);font-size:11px;color:#626863;padding:7px 24px;display:flex;justify-content:space-between}.preview span:last-child{color:var(--accent)}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:-.8px}.brand img{width:30px;height:30px;object-fit:contain}.avatar{width:38px;height:38px;background:var(--paper);border-radius:50%;font-size:12px;font-weight:650}.main{padding:14px 24px 30px;flex:1}h1{font-size:32px;line-height:1.15;letter-spacing:-1.2px;font-weight:650;margin:0 0 8px}h2{font-size:18px;font-weight:650;letter-spacing:-.35px;margin:0}p{margin:0}.lead{color:var(--muted);font-size:14px;margin-bottom:26px}.topline{display:flex;align-items:center;justify-content:space-between}.text-button{font-size:13px;color:var(--accent);padding:8px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}.chip{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;gap:7px;align-items:center;font-size:12px;min-height:38px}.chip svg{width:15px;height:15px}.chip .chevron{width:12px}.sectionlabel{font-size:11px;letter-spacing:.8px;color:var(--muted);font-weight:600;margin-bottom:4px}.project{width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}.project:first-child{border-top:1px solid var(--line)}.project-copy{flex:1;min-width:0}.project h2{font-size:17px;line-height:1.4}.project .meta{font-size:12px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.project .category{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:5px}.project .arrow{width:17px;margin-top:22px;color:#8a908b}.project:hover{background:#fafbf9}.row{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}.row span{flex:1}.row .arrow{width:17px;color:var(--muted)}.quiet{margin-top:25px;padding:15px 0;color:var(--muted);font-size:12px;display:flex;align-items:flex-start;gap:10px}.quiet svg{width:18px;height:18px}.tabs{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;padding:9px 8px calc(10px + env(safe-area-inset-bottom));flex-shrink:0}.tabs button{flex:1;display:flex;align-items:center;flex-direction:column;gap:5px;min-height:48px;font-size:10px;color:#858a86;padding:4px}.tabs button[aria-selected=true]{color:var(--ink);font-weight:650}.tabs button[aria-selected=true] svg{stroke-width:2.2}.tabs button[aria-selected=true]::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent)}.tabs button::after{content:'';height:4px}.empty{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px}.empty strong{color:var(--ink);display:block;font-size:16px;margin-bottom:5px}.primary{background:var(--ink);color:#fff;width:100%;padding:13px 16px;border-radius:7px;font-size:14px;font-weight:550;min-height:46px}.detailtop{display:flex;align-items:center;gap:12px;margin-bottom:28px}.detailtop button{border:1px solid var(--line);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}.detailtop svg{width:18px}.detailtitle{font-size:27px;line-height:1.2;letter-spacing:-.8px;margin:9px 0 12px}.description{font-size:15px;line-height:1.7;margin:22px 0}.facts{margin:22px 0}.facts .row{display:flex;justify-content:space-between}.facts .row span{color:var(--muted)}.profilemark{width:64px;height:64px;border-radius:12px;background:var(--paper);display:grid;place-items:center;margin:12px 0 18px;font-size:22px;font-weight:650}.notice{font-size:12px;color:var(--muted);margin-top:14px}.sheet{border:0;border-radius:18px 18px 0 0;width:min(100%,520px);max-width:520px;margin:auto auto 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));color:var(--ink)}.sheet::backdrop{background:rgba(20,25,22,.3)}.sheet .topline{margin-bottom:25px}.sheet label{display:block;font-size:13px;margin-bottom:20px}.sheet input{width:100%;padding:12px;margin-top:7px;border:1px solid var(--line);border-radius:7px}.sheet .close{font-size:22px;width:35px;height:35px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--ink);color:#fff;border-radius:8px;font-size:12px;max-width:90vw;z-index:5;display:none}.toast.show{display:block}button:active{opacity:.65}section{animation:appear .18s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){section{animation:none}}@media(min-width:700px){.app{margin:32px auto;min-height:calc(100dvh - 64px);border:1px solid var(--line);border-radius:20px;overflow:clip}.tabs{border-radius:0 0 20px 20px}}@media(max-width:360px){header,.main{padding-left:18px;padding-right:18px}h1{font-size:29px}}
</style>
</head><body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l3 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="quote" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z M14 3v5h5 M9 12h7 M9 16h5"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4Z M8 8h8 M8 12h5"/></symbol>
<symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4Z M10 21h4"/></symbol>
</defs></svg>
<div class="app"><div class="preview"><span>Aperçu du menu</span><span>Données d’exemple</span></div><header><div class="brand"><img src="/icons/apple-touch-icon-projeko-v3.png" alt="">Projeko</div><button class="avatar" data-tab="profile" aria-label="Voir mon profil">ET</button></header><main class="main" id="content"></main><nav class="tabs" aria-label="Menu entrepreneur" role="tablist"><button data-tab="projects" role="tab" aria-selected="true"><svg><use href="#folder"/></svg>Projets</button><button data-tab="quotes" role="tab" aria-selected="false"><svg><use href="#quote"/></svg>Soumissions</button><button data-tab="messages" role="tab" aria-selected="false"><svg><use href="#chat"/></svg>Messages</button><button data-tab="profile" role="tab" aria-selected="false"><svg><use href="#person"/></svg>Profil</button></nav></div>
<dialog class="sheet" id="filters"><form method="dialog" id="filterForm"><div class="topline"><h2>Votre zone de travail</h2><button class="close" value="cancel" aria-label="Fermer">×</button></div><label>Ville<input id="city" value="Montréal" maxlength="50" required></label><label>Rayon de service (km)<input id="radius" type="number" value="50" min="1" max="500" required></label><p class="notice" style="margin-bottom:20px">Rénovation générale · aperçu uniquement</p><button class="primary" value="save">Appliquer</button></form></dialog><div class="toast" role="status" id="toast"></div>
<script>
const content=document.getElementById('content'),dialog=document.getElementById('filters');let city='Montréal',radius=50,tab='projects',toastTimer;
const icon=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const projects=[{title:'Refaire la cuisine',trade:'Rénovation générale',city:'Montréal',time:'Il y a 2 h',budget:'15 000–25 000 $',when:'Cet automne',description:'Nous souhaitons remplacer les armoires et le comptoir, puis revoir l’éclairage. Nous cherchons un entrepreneur pour nous accompagner dans les travaux.'},{title:'Rénover la salle de bain',trade:'Rénovation générale',city:'Laval',time:'Il y a 5 h',budget:'10 000–15 000 $',when:'À discuter',description:'Nous aimerions refaire la douche et remplacer le meuble-lavabo. La pièce mesure environ 8 × 10 pieds.'},{title:'Finir le sous-sol',trade:'Rénovation générale',city:'Longueuil',time:'Hier',budget:'À discuter',when:'Dans les prochains mois',description:'Nous voulons aménager une salle familiale et un petit bureau au sous-sol.'}];
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let html='';
if(tab==='projects')html=`<section><div class="topline"><h1>Projets</h1><button class="text-button" data-filter>Mes services</button></div><p class="lead">Des travaux dans votre zone.</p><div class="filters"><button class="chip" data-filter>${icon('pin')}${escapeText(city)} · ${radius} km ${icon('down','chevron')}</button><button class="chip" data-filter>Rénovation générale ${icon('down','chevron')}</button></div><div class="sectionlabel">POUR VOUS</div>${projects.map((p,i)=>`<button class="project" data-project="${i}"><div class="project-copy"><p class="category">${p.trade}</p><h2>${p.title}</h2><p class="meta">${p.city}<span>·</span>${p.time}</p></div>${icon('arrow','arrow')}</button>`).join('')}<div class="quiet">${icon('bell')}<p>Les nouveaux projets apparaîtront ici selon vos services et votre territoire.</p></div></section>`;
if(tab==='quotes')html=`<section><h1>Soumissions</h1><p class="lead">Vos offres, au même endroit.</p><div class="empty"><strong>Aucune soumission envoyée.</strong>Ouvrez un projet pour préparer votre première offre.</div><button class="primary" data-tab="projects">Voir les projets</button></section>`;
if(tab==='messages')html=`<section><h1>Messages</h1><p class="lead">Gardez le fil avec vos clients.</p><div class="empty"><strong>Pas de conversation pour le moment.</strong>Vos échanges avec les clients apparaîtront ici.</div></section>`;
if(tab==='profile')html=`<section><h1>Mon entreprise</h1><div class="profilemark">ET</div><h2>Entreprise Test</h2><p class="lead" style="margin-top:5px">Montréal · Rénovation générale</p><button class="row" data-note="La modification du profil sera reliée à votre compte dans l’app.">${icon('person')}<span>Modifier mon profil</span>${icon('arrow','arrow')}</button><button class="row" data-filter>${icon('pin')}<span>Services et territoire</span>${icon('arrow','arrow')}</button><button class="row" data-note="Vos réglages de notification seront conservés dans l’app.">${icon('bell')}<span>Notifications</span>${icon('arrow','arrow')}</button><button class="row" data-note="Cette page est un aperçu. Vous êtes toujours connecté dans l’app."><span>Se déconnecter</span>${icon('arrow','arrow')}</button><p class="notice">Aperçu visuel : aucune donnée de votre compte n’est modifiée.</p></section>`;
content.innerHTML=html;}
function detail(i){const p=projects[i];content.innerHTML=`<section><div class="detailtop"><button data-tab="projects" aria-label="Retour aux projets"><svg style="transform:rotate(180deg)"><use href="#arrow"/></svg></button><span>Le projet</span></div><p class="sectionlabel">${p.trade}</p><h1 class="detailtitle">${p.title}</h1><p class="lead">${p.city} · ${p.time}</p><p class="description">${p.description}</p><div class="facts"><div class="row"><span>Budget prévu</span><b>${p.budget}</b></div><div class="row"><span>Début des travaux</span><b>${p.when}</b></div></div><button class="primary" data-note="Dans l’app, ce bouton ouvrira votre formulaire de soumission.">Préparer une soumission</button><p class="notice">Projet d’exemple pour essayer ce menu.</p></section>`;}
function notify(text){clearTimeout(toastTimer);const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})}if(b.hasAttribute('data-project')){detail(Number(b.dataset.project));window.scrollTo({top:0,behavior:'instant'})}if(b.hasAttribute('data-filter'))dialog.showModal();if(b.dataset.note)notify(b.dataset.note)});
dialog.addEventListener('close',()=>{if(dialog.returnValue==='save'){city=document.getElementById('city').value.trim()||'Montréal';radius=Math.max(1,Math.min(500,Number(document.getElementById('radius').value)||50));render();notify('Zone modifiée dans cet aperçu.')}});render();
</script></body></html>
