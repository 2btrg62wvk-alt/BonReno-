name: Premium Intro Runtime
'on':
  push:
    paths: ['.github/workflows/premium-intro-runtime.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install premium intro runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if 'rd104-premium-runtime' in s: raise SystemExit(0)
          css='''<style id="rd104-premium-runtime">
          .rd104{position:fixed;inset:0;z-index:2147483000;background:#0b0c0a;color:#f3f0e8;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
          .rd104.hide{opacity:0;pointer-events:none;transition:opacity .38s ease}.rd104-in{height:100%;box-sizing:border-box;padding:calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
          .rd104-noise{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) .5px,transparent .65px);background-size:5px 5px;opacity:.08}.rd104-glow{position:absolute;width:330px;height:330px;border-radius:50%;right:-155px;top:125px;background:radial-gradient(circle,rgba(235,225,198,.12),rgba(235,225,198,.035) 38%,transparent 70%);animation:r104g 7s ease-in-out infinite alternate}.rd104-orb{position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.07);border-radius:50%;left:-78px;bottom:160px;animation:r104f 9s ease-in-out infinite}
          .rd104-c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}.rd104 header{display:flex;justify-content:space-between;align-items:center}.rd104-brand{display:flex;align-items:center;gap:12px}.rd104-logo{width:40px;height:40px;border:1px solid rgba(243,240,232,.24);border-radius:50%;display:flex;align-items:center;justify-content:center}.rd104-b{font-size:17px;font-weight:500}.rd104-s{font-size:8px;letter-spacing:.27em;color:#ffffff59;margin-top:2px}.rd104-main{flex:1;display:flex;flex-direction:column;justify-content:center}.rd104-eye{font-size:9px;letter-spacing:.31em;color:#ffffff73;margin-bottom:27px;opacity:0;animation:r104r .8s .25s forwards}.rd104 h1{font-size:49px;line-height:.94;letter-spacing:-.052em;font-weight:300;margin:0;opacity:0;transform:translateY(18px);animation:r104r 1s .48s forwards}.rd104 h1 span{font-family:Georgia,serif;font-style:italic;color:#ffffffab}.rd104-p{margin-top:27px;max-width:275px;font-size:14px;line-height:1.7;color:#ffffff6e;opacity:0;animation:r104r .9s .78s forwards}.rd104-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:32px}.rd104-step{border-top:1px solid #ffffff26;padding-top:12px;font-size:11px;color:#ffffffa6}.rd104-step small{display:block;font-size:9px;color:#ffffff4d;margin-bottom:8px}.rd104 footer{border-top:1px solid #f3f0e82b;padding-top:20px;display:flex;justify-content:space-between;align-items:center}.rd104-enter{font-size:13px;font-weight:500}.rd104-touch{font-size:10px;color:#ffffff4d;margin-top:6px}.rd104-arrow{width:56px;height:56px;border:1px solid #ffffff33;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;animation:r104a 2.7s ease-in-out infinite}.rd104 svg{position:absolute;right:-45px;top:112px;width:310px;height:355px}.rd104-path{fill:none;stroke:#f3f0e81c;stroke-width:1;stroke-dasharray:900;stroke-dashoffset:900;animation:r104d 3.2s ease forwards}
          @keyframes r104r{to{opacity:1;transform:translateY(0)}}@keyframes r104d{to{stroke-dashoffset:0}}@keyframes r104g{to{transform:translate(25px,28px) scale(1.18)}}@keyframes r104f{50%{transform:translate(18px,-25px)}}@keyframes r104a{50%{transform:translate(4px,-4px)}}@media(max-width:360px){.rd104-in{padding-left:22px;padding-right:22px}.rd104 h1{font-size:43px}}@media(prefers-reduced-motion:reduce){.rd104 *{animation:none!important;opacity:1!important;transform:none!important}.rd104-path{stroke-dashoffset:0!important}}
          </style>'''
          js='''<script id="rd104-premium-runtime">(function(){if(document.getElementById("rd104"))return;var d=document.createElement("div");d.id="rd104";d.className="rd104";d.innerHTML='<div class="rd104-noise"></div><div class="rd104-glow"></div><div class="rd104-orb"></div><svg viewBox="0 0 310 355"><path class="rd104-path" d="M38 320V118L155 36l116 82v202M77 320V143l78-55 78 55v177M116 320V190h78v130"/><path class="rd104-path" d="M38 118L155 36l116 82"/></svg><div class="rd104-in"><div class="rd104-c"><header><div class="rd104-brand"><div class="rd104-logo">R</div><div><div class="rd104-b">RénoDirect</div><div class="rd104-s">RÉNOVATION SIMPLIFIÉE</div></div></div><div style="font-size:10px;color:#ffffff59">01</div></header><main class="rd104-main"><div class="rd104-eye">PROJET · EXPERTISE · CONFIANCE</div><h1>Rénover,<br><span>sans compromis.</span></h1><div class="rd104-p">Votre projet. Des professionnels qualifiés. Une expérience pensée pour avancer simplement.</div></main><div class="rd104-steps"><div class="rd104-step"><small>01</small>Décrivez</div><div class="rd104-step"><small>02</small>Comparez</div><div class="rd104-step"><small>03</small>Réalisez</div></div><footer><div><div class="rd104-enter">Entrer dans RénoDirect</div><div class="rd104-touch">Touchez n’importe où</div></div><div class="rd104-arrow">↗</div></footer></div></div>';document.body.appendChild(d);d.addEventListener("click",function(){d.classList.add("hide");setTimeout(function(){d.remove()},400);var old=document.querySelector(".rd94-photo-cta");if(old)old.click()},{once:true})})();</script>'''
          if '</head>' not in s or '</body>' not in s: raise SystemExit("document markers missing")
          s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Install premium animated intro runtime"
          git push
