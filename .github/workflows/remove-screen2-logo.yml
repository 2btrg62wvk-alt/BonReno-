name: Remove screen 2 RenoDirect logo
on:
  push:
    paths:
      - '.github/workflows/remove-screen2-logo.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hide only screen 2 logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          marker='rd113-hide-screen2-logo'
          if marker not in s:
              css='''<style id="rd113-hide-screen2-logo">
#accueil.rd110-choice .rd110-head .rd110-logo{display:none !important;}
</style>
'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          assert 'id="rd110-choice-design"' in s
          assert 'href="#client"' in s
          assert 'href="#pro1"' in s
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove RenoDirect logo from role selection screen"
          git push origin main
