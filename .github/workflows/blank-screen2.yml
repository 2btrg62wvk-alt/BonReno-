name: Blank screen 2
on:
  push:
    paths:
      - '.github/workflows/blank-screen2.yml'
permissions:
  contents: write
jobs:
  blank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make role screen blank
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          start=s.find('<section id="accueil"')
          if start < 0: raise SystemExit("accueil not found")
          end=s.find('</section>',start)
          if end < 0: raise SystemExit("accueil end not found")
          end += len('</section>')
          blank='''<section id="accueil" class="screen active rd121-blank"></section>'''
          s=s[:start]+blank+s[end:]
          css='''<style id="rd121-blank-screen2">
#accueil.rd121-blank{min-height:100svh;width:100%;margin:0;padding:0;background:#f3f1eb;overflow:hidden;}
</style>
'''
          if 'id="rd121-blank-screen2"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          Path("index.html").write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Leave role selection screen blank for redesign"
          git push origin main
