name: Remove legacy rd105 layer
on:
  push:
    paths:
      - '.github/workflows/remove-rd105-layer.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy rd105 visual layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          marker='rd112-remove-rd105-layer'
          if marker not in s:
              css='''<style id="rd112-remove-rd105-layer">
#rd105,
.rd105-halo,
.rd105-halo2,
.rd105-grid{
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}
</style>
'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          assert 'id="rd110-choice-design"' in s
          assert 'href="#client"' in s
          assert 'href="#pro1"' in s
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Hide legacy rd105 design behind new choice screen"
          git push origin main
