name: Modernize profile finish
on:
  push:
    paths: ['.github/workflows/modernize-profile-finish.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Modernize animation and profile preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-profile-finish-modern-v1">
          :is(#building,#profilePreview):is(#building,#profilePreview){background:radial-gradient(ellipse at 100% 0%,rgba(76,120,89,.12),transparent 48%),linear-gradient(150deg,#f3f2e9,#eceee5)!important;color:#173327!important;padding:calc(22px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom))!important;overflow:auto!important;min-height:100svh!important}
          :is(#building,#profilePreview):is(#building,#profilePreview) .rd-profile-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:480px;margin:0 auto 24px}
          :is(#building,#profilePreview):is(#building,#profilePreview) .rd-profile-nav .back{margin:0!important;padding:10px 0!important;font-size:13px!important;color:#365844!important;min-height:44px}
          :is(#building,#profilePreview):is(#building,#profilePreview) .rd-profile-brand{font-size:16px;font-weight:800;letter-spacing:-.04em;color:#153a29}
          :is(#building,#profilePreview):is(#building,#profilePreview) a:focus-visible{outline:3px solid #8fa980;outline-offset:4px}
          :is(#building,#profilePreview):is(#building,#profilePreview) a.primary{display:flex!important;align-items:center!important;justify-content:center!important;min-height:54px!important;padding:15px!important;border-radius:15px!important;background:linear-gradient(120deg,#274e35,#183d2a)!important;color:#fffef8!important;font-size:15px!important;font-weight:700!important;box-shadow:0 8px 20px rgba(30,69,42,.13)!important;white-space:normal!important}
          #building#building .build-wrap{width:100%!important;max-width:480px!important;margin:0 auto!important;min-height:calc(100svh - 150px)!important;padding:26px 23px!important;display:grid!important;place-items:center!important;background:rgba(255,255,250,.86)!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:28px!important;box-shadow:0 18px 60px rgba(30,57,40,.07)!important}
          #building#building .build-wrap>div{width:100%;max-width:350px}
          #building#building .build-scene{width:170px!important;height:160px!important;display:grid;place-items:center;margin:0 auto 26px!important;border-radius:35px;background:radial-gradient(circle,#e5ecdd,transparent 75%)}
          #building#building .house-line{stroke:#315d40!important}
          #building#building .house-detail{stroke:#86a174!important}
          #building#building .build-check circle{fill:#dce8d0!important}
          #building#building .build-check path{stroke:#315d40!important}
          #building#building .build-title{font-size:clamp(28px,5vw,34px)!important;color:#173327!important;line-height:1.1!important;letter-spacing:-.045em!important;font-weight:650!important;margin:0 0 14px!important}
          #building#building .build-copy{color:#74806e!important;font-size:14px!important;line-height:1.65!important;margin:auto!important;max-width:300px!important}
          #building#building .build-dots{margin:24px auto!important}
          #building#building .build-dots i{background:#7c9c69!important}
          #building#building .back{font-size:13px!important;color:#56705b!important}
          #profilePreview#profilePreview .modern-profile{width:100%!important;max-width:480px!important;margin:0 auto!important;padding:26px!important;background:rgba(255,255,250,.86)!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:28px!important;box-shadow:0 18px 60px rgba(30,57,40,.07)!important}
          #profilePreview#profilePreview .step{font-size:10px!important;letter-spacing:.14em!important;color:#54705b!important;margin-bottom:18px!important}
          #profilePreview#profilePreview .mp-hero{padding:23px 20px!important;background:linear-gradient(135deg,#315b3e,#173c29)!important;border:0!important;border-radius:22px!important;margin:0 0 20px!important}
          #profilePreview#profilePreview .mp-topline{margin-bottom:24px!important}
          #profilePreview#profilePreview .mp-badge{font-size:9px!important;color:#d9e6ce!important;letter-spacing:.07em!important}
          #profilePreview#profilePreview .mp-share{background:rgba(255,255,245,.08)!important;border:1px solid rgba(231,240,218,.20)!important;color:#edf2e6!important;flex:0 0 34px;width:34px!important;height:34px!important}
          #profilePreview#profilePreview .mp-identity{gap:13px!important;align-items:center!important}
          #profilePreview#profilePreview .mp-avatar{flex:0 0 56px!important;width:56px!important;height:56px!important;font-size:20px!important;border-radius:17px!important;background:#e5edda!important;color:#315d40!important;box-shadow:none!important}
          #profilePreview#profilePreview .mp-company h3{font-size:24px!important;font-weight:650!important;line-height:1.1!important;color:#fffef6!important;overflow-wrap:normal!important}
          #profilePreview#profilePreview .mp-company p{color:#cfdec5!important;font-size:12px!important;line-height:1.5!important}
          #profilePreview#profilePreview .mp-stats{border:1px solid #dfe6d7!important;background:#f4f7ed!important;border-radius:18px!important;overflow:hidden!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;margin:0 0 24px!important}
          #profilePreview#profilePreview .mp-stat{padding:16px 4px!important}
          #profilePreview#profilePreview .mp-stat+.mp-stat{border-left:1px solid #dfe6d7!important}
          #profilePreview#profilePreview .mp-stat strong{font-size:14px!important;color:#315d40!important}
          #profilePreview#profilePreview .mp-stat span{font-size:9px!important;color:#788671!important;letter-spacing:0!important;text-transform:none!important}
          #profilePreview#profilePreview .mp-section{margin:24px 0!important}
          #profilePreview#profilePreview .mp-section-head h4{color:#234731!important;font-size:16px!important;font-weight:700!important}
          #profilePreview#profilePreview .mp-section-head span{color:#788671!important;font-size:11px!important}
          #profilePreview#profilePreview .mp-chips{gap:8px!important}
          #profilePreview#profilePreview .mp-chip{width:auto!important;margin:0!important;padding:10px 12px!important;background:#f4f7ed!important;color:#42603c!important;border:1px solid #dfe6d7!important;font-size:12px!important;line-height:1.4!important;white-space:normal!important;word-break:normal!important;overflow-wrap:normal!important}
          #profilePreview#profilePreview .mp-chip.primary{background:#e5edda!important;color:#315d40!important;border-color:#cddcbe!important}
          #profilePreview#profilePreview .mp-area{background:radial-gradient(circle at 50% 40%,rgba(123,157,104,.13) 0 18%,transparent 19%),radial-gradient(circle at 50% 40%,transparent 0 36%,rgba(123,157,104,.10) 37% 38%,transparent 39%),#f0f4e8!important;border:1px solid #dfe6d7!important;border-radius:18px!important;min-height:160px!important}
          #profilePreview#profilePreview .mp-pin{background:#315d40!important;box-shadow:0 0 0 8px rgba(123,157,104,.13),0 0 0 18px rgba(123,157,104,.07)!important;top:38%!important}
          #profilePreview#profilePreview .mp-area-copy strong{color:#315d40!important;font-size:13px!important}
          #profilePreview#profilePreview .mp-area-copy span{color:#74806e!important;font-size:12px!important}
          #profilePreview#profilePreview .mp-gallery{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}
          #profilePreview#profilePreview .mp-shot{height:88px!important;background:#f4f7ed!important;border:1px dashed #ccd9c3!important;color:#78946a!important;border-radius:16px!important}
          #profilePreview#profilePreview .mp-about{font-size:13px!important;line-height:1.65!important;color:#74806e!important}
          #profilePreview#profilePreview .mp-license{gap:12px!important}
          #profilePreview#profilePreview .mp-license+.mp-license{border-color:#e0e6da!important}
          #profilePreview#profilePreview .mp-license-icon{background:#e8ede1!important;color:#315d40!important;flex-shrink:0!important}
          #profilePreview#profilePreview .mp-license strong{font-size:13px!important;color:#315d40!important}
          #profilePreview#profilePreview .mp-license span{font-size:12px!important;color:#74806e!important;line-height:1.5!important}
          #profilePreview#profilePreview .mp-edit{font-size:13px!important;color:#54705b!important;min-height:44px!important}
          @media(max-width:380px){:is(#building,#profilePreview):is(#building,#profilePreview){padding-left:14px!important;padding-right:14px!important}#profilePreview#profilePreview .modern-profile{padding:20px!important}#profilePreview#profilePreview .mp-company h3{font-size:21px!important}}
          </style>'''
          if 'id="rd-profile-finish-modern-v1"' in s: raise SystemExit('Already applied')
          for sid,back in [('building','territory'),('profilePreview','building')]:
              start=s.index('<section id="'+sid+'"');end=s.index('</section>',start)
              part=s[start:end]
              nav='<nav class="rd-profile-nav" aria-label="Navigation profil entrepreneur"><a class="back" href="#'+back+'">← Retour</a><span class="rd-profile-brand">RénoDirect<span style="color:#9fba8c"> ·</span></span></nav>'
              if sid=='profilePreview':
                  part=part.replace('  <a class="back" href="#building">‹ Back</a>\n','',1)
              part=part.replace('class="screen">','class="screen">\n'+nav,1)
              s=s[:start]+part+s[end:]
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s)
          
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Modernize entrepreneur profile animation and preview'
          git push
