name: Keep service words intact
on:
  push:
    paths: ['.github/workflows/services-whole-words.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Keep words intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-services-whole-words-v1">
          #services#services .service-option label{position:relative!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:9px!important;padding:14px 12px!important;min-height:108px!important;grid-template-columns:none!important;white-space:normal!important;overflow-wrap:normal!important;word-break:normal!important;hyphens:none!important;font-size:13px!important;line-height:1.4!important}
          #services#services .service-option input:checked+label::after{position:absolute!important;top:13px!important;right:12px!important;margin:0!important}
          </style>'''
          if 'id="rd-services-whole-words-v1"' not in s:
              p.write_text(s.replace('</body>',css+'</body>',1))
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep complete words on entrepreneur service buttons'
          git push
