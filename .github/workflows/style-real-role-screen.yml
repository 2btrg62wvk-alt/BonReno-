name: Style Real Role Screen
'on':
  push:
    paths: ['.github/workflows/style-real-role-screen.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove overlay and style real role screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          s=re.sub(r'<style id="rd106-role-premium">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="rd106-role-premium-runtime">.*?</script>','',s,flags=re.S)
          css='''<style id="rd107-real-role">
          #home{position:relative!important;overflow:hidden!important;margin:calc(-18px - env(safe-area-inset-top)) -22px calc(-24px - env(safe-area-inset-bottom))!important;padding:calc(30px + env(safe-area-inset-top)) 25px calc(25px + env(safe-area-inset-bottom))!important;min-height:100dvh!important;background:linear-gradient(145deg,#cecfc6 0%,#e2dfd5 46%,#c5cbc2 100%)!important;color:#0b1710!important}
          #home:before{content:"";position:absolute;width:480px;height:480px;border-radius:50%;right:-270px;top:-170px;background:radial-gradient(circle,rgba(255,255,248,.75),rgba(255,255,248,.1) 50%,transparent 70%);animation:rd107g 7s ease-in-out infinite alternate;pointer-events:none}
          #home:after{content:"";position:absolute;inset:0;opacity:.1;background-image:linear-gradient(rgba(25,44,31,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(25,44,31,.15) 1px,transparent 1px);background-size:55px 55px;animation:rd107grid 20s linear infinite;pointer-events:none}
          #home>*{position:relative;z-index:2}
          #home .brand{width:auto!important;height:auto!important;border-radius:0!important;background:none!important;box-shadow:none!important;display:block!important;color:#09160e!important;font-size:21px!important;font-weight:800!important;letter-spacing:-.045em!important}
          #home .hero{padding-top:62px!important}
          #home .eyebrow{font-size:9px!important;font-weight:800!important;letter-spacing:.23em!important;color:#263a2d!important;margin-bottom:15px!important}
          #home h1{font-size:43px!important;line-height:.96!important;letter-spacing:-.055em!important;font-weight:560!important;color:#0a160e!important;margin:0!important;max-width:330px!important}
          #home p{font-size:13px!important;line-height:1.55!important;color:#283a30!important;font-weight:520!important;margin-top:15px!important;max-width:300px!important}
          #home .role{margin-top:36px!important;display:grid!important;gap:12px!important}
          #home .role a,#home .role button,#home a.navbtn{position:relative!important;display:block!important;min-height:130px!important;border:1px solid rgba(15,34,21,.19)!important;border-radius:24px!important;padding:20px!important;background:rgba(250,249,242,.76)!important;color:#0a160e!important;text-decoration:none!important;font-size:23px!important;letter-spacing:-.04em!important;font-weight:750!important;box-shadow:none!important;transition:transform .2s ease,background .2s ease!important}
          #home .role a:active,#home .role button:active,#home a.navbtn:active{transform:scale(.985)!important;background:#14251a!important;color:#fffdf5!important}
          #home .role small,#home a.navbtn small{display:block!important;font-size:11px!important;line-height:1.45!important;color:#3b4a41!important;font-weight:520!important;margin-top:6px!important;max-width:250px!important;letter-spacing:0!important}
          #home .role a:active small,#home .role button:active small,#home a.navbtn:active small{color:#e1e8e2!important}
          @keyframes rd107g{to{transform:translate(-45px,50px) scale(1.14)}}@keyframes rd107grid{to{background-position:55px 55px}}
          @media(max-width:360px){#home{padding-left:21px!important;padding-right:21px!important}#home h1{font-size:38px!important}}
          @media(prefers-reduced-motion:reduce){#home:before,#home:after{animation:none!important}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Style original client entrepreneur screen"
          git push
