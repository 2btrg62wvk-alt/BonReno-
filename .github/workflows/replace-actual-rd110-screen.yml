name: Replace actual rd110 screen
on:
  push:
    paths:
      - '.github/workflows/replace-actual-rd110-screen.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Replace actual visible screen 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html"); s=p.read_text()
          start=s.find('<section id="accueil" class="screen active rd110-choice"')
          if start<0: raise SystemExit("VISIBLE rd110 accueil not found")
          end=s.find('</section>',start)
          if end<0: raise SystemExit("end not found")
          end+=len('</section>')
          html='''<section id="accueil" class="screen active rd140-choice">
<div class="rd140-circle c1"></div><div class="rd140-circle c2"></div>
<main class="rd140-shell">
<div class="rd140-top"><a href="#intro" class="rd140-back" aria-label="Retour">‹</a><div class="rd140-progress"><b></b><i></i><i></i><i></i></div></div>
<div class="rd140-kicker">CHOISISSEZ VOTRE PROFIL</div>
<h1>Vous êtes ici pour <em>quoi?</em></h1>
<p class="rd140-desc">Choisissez votre espace. RénoDirect adaptera l'expérience à votre façon de rénover.</p>
<div class="rd140-list">
<a href="#client" class="rd140-card client"><span class="rd140-icon">⌂</span><div><h2>Je suis client</h2><p>J'ai un projet et je veux trouver les bons professionnels.</p></div><strong>→</strong></a>
<a href="#pro1" class="rd140-card pro"><span class="rd140-icon">⌁</span><div><h2>Je suis entrepreneur</h2><p>Je veux découvrir des projets et développer mon entreprise.</p></div><strong>→</strong></a>
</div>
<div class="rd140-existing"><div><span></span><b>DÉJÀ UN COMPTE ?</b><span></span></div><nav><a href="#loginClient">Se connecter comme client</a><i></i><a href="#loginPro">Se connecter comme entrepreneur</a></nav></div>
</main></section>'''
          s=s[:start]+html+s[end:]
          css='''<style id="rd140-approved">
#accueil.rd140-choice{min-height:100svh;box-sizing:border-box;position:relative;overflow:auto;padding:28px clamp(18px,5vw,64px) 34px;background:#f2f1e9;color:#092519;font-family:inherit}
#accueil.rd140-choice:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(27,62,43,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(27,62,43,.035) 1px,transparent 1px);background-size:70px 70px;pointer-events:none}
#accueil .rd140-circle{position:absolute;border:1px solid rgba(17,52,35,.18);border-radius:50%;pointer-events:none}.c1{width:330px;height:330px;right:-220px;top:180px}.c2{width:260px;height:260px;left:-190px;bottom:-100px}
#accueil .rd140-shell{position:relative;z-index:1;width:min(900px,100%);margin:auto}
#accueil .rd140-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:58px}.rd140-back{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid rgba(13,45,29,.08);box-shadow:0 8px 24px rgba(24,50,35,.07);text-decoration:none;color:#173d2b;font-size:38px}.rd140-progress{display:flex;gap:8px}.rd140-progress>*{display:block;width:45px;height:5px;border-radius:8px;background:rgba(15,49,31,.15)}.rd140-progress b{background:#24553b}
#accueil .rd140-kicker{font-size:12px;font-weight:800;letter-spacing:.27em;color:#3c5d4b;margin-bottom:16px}
#accueil .rd140-shell>h1{font-size:clamp(52px,8vw,78px);line-height:.9;letter-spacing:-.055em;margin:0;font-weight:780}.rd140-shell>h1 em{display:block;font-family:Georgia,serif;font-weight:400;color:#326047}
#accueil .rd140-desc{font-size:clamp(17px,2.3vw,21px);line-height:1.48;color:#405d4d;max-width:720px;margin:22px 0 32px}
#accueil .rd140-list{display:grid;gap:16px}.rd140-card{position:relative;min-height:245px;padding:26px;border-radius:30px;overflow:hidden;text-decoration:none;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box;isolation:isolate;box-shadow:0 15px 45px rgba(19,43,29,.1)}.rd140-card:before{content:"";position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}.rd140-card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(4,31,19,.92),rgba(4,31,19,.54) 58%,rgba(4,31,19,.13))}
#accueil .rd140-card.client:before{background-image:url("https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&w=1500&q=88")}#accueil .rd140-card.pro:before{background-image:url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1500&q=88")}
#accueil .rd140-icon{position:absolute;top:22px;left:24px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(31,75,53,.52);backdrop-filter:blur(9px);display:grid;place-items:center;font-size:30px}.rd140-card h2{font-size:clamp(29px,4vw,38px);margin:0 70px 7px 0;letter-spacing:-.035em}.rd140-card p{font-size:16px;line-height:1.45;margin:0 70px 0 0;color:rgba(255,255,255,.9)}.rd140-card strong{position:absolute;right:23px;bottom:24px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;font-size:28px;background:rgba(8,26,17,.3)}
#accueil .rd140-existing{margin:27px auto 0;max-width:720px}.rd140-existing>div{display:flex;align-items:center;gap:14px}.rd140-existing>div span{height:1px;background:rgba(20,53,36,.18);flex:1}.rd140-existing b{font-size:10px;letter-spacing:.25em;color:#566d60}.rd140-existing nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:14px}.rd140-existing nav a{font-size:13px;font-weight:750;color:#173d2b;text-underline-offset:4px}.rd140-existing nav i{width:1px;height:18px;background:rgba(20,53,36,.2)}
@media(min-width:800px){#accueil .rd140-list{grid-template-columns:1fr 1fr}.rd140-card{min-height:300px}}
@media(max-width:600px){#accueil.rd140-choice{padding-top:22px}#accueil .rd140-top{margin-bottom:42px}#accueil .rd140-shell>h1{font-size:52px}.rd140-card{min-height:225px;border-radius:27px}.rd140-existing nav{gap:9px;flex-wrap:wrap}.rd140-existing nav a{font-size:11.5px}}
</style>'''
          if 'id="rd140-approved"' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          assert 'rd110-choice' not in s[start:start+len(html)+50]
          for r in ['href="#client"','href="#pro1"','href="#loginClient"','href="#loginPro"']: assert r in html
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Replace actual visible role screen with approved design"
          git push origin main
