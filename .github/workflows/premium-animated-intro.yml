name: Premium Animated Intro
'on':
  push:
    paths:
      - '.github/workflows/premium-animated-intro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace intro visually with approved premium animated design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if 'id="rd103-premium-intro"' in s: raise SystemExit(0)
          head='''<style id="rd103-premium-intro">
          #intro{position:relative!important;overflow:hidden!important;background:#0b0c0a!important;color:#f3f0e8!important;isolation:isolate}
          #intro>*:not(#rd103-shell):not(.rd94-photo-cta){visibility:hidden!important}
          #rd103-shell{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}
          #rd103-shell:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) .5px,transparent .65px);background-size:5px 5px;opacity:.08;pointer-events:none}
          #rd103-shell .glow{position:absolute;width:330px;height:330px;border-radius:50%;right:-155px;top:125px;background:radial-gradient(circle,rgba(235,225,198,.12),rgba(235,225,198,.035) 38%,transparent 70%);animation:rd103Glow 7s ease-in-out infinite alternate}
          #rd103-shell .orb{position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.07);border-radius:50%;left:-78px;bottom:160px;animation:rd103Float 9s ease-in-out infinite}
          #rd103-shell .content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
          #rd103-shell header{display:flex;align-items:center;justify-content:space-between}
          #rd103-shell .brand{display:flex;align-items:center;gap:12px}.rd103-logo{width:40px;height:40px;border-radius:50%;border:1px solid rgba(243,240,232,.24);display:flex;align-items:center;justify-content:center;font-size:15px}
          #rd103-shell .brandname{font-size:17px;font-weight:500;letter-spacing:-.02em}.rd103-sub{font-size:8px;text-transform:uppercase;letter-spacing:.27em;color:rgba(255,255,255,.35);margin-top:2px}
          #rd103-shell .main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:5px}.rd103-eye{font-size:9px;text-transform:uppercase;letter-spacing:.31em;color:rgba(255,255,255,.45);margin-bottom:27px;opacity:0;animation:rd103Reveal .8s ease .25s forwards}
          #rd103-shell h1{font-size:49px;line-height:.94;letter-spacing:-.052em;font-weight:300;margin:0;max-width:350px;opacity:0;transform:translateY(18px);animation:rd103Reveal 1s cubic-bezier(.2,.7,.2,1) .48s forwards}.rd103-serif{font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,.67)}
          #rd103-shell .copy{margin-top:27px;max-width:275px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.43);opacity:0;transform:translateY(12px);animation:rd103Reveal .9s ease .78s forwards}
          #rd103-shell .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:32px;opacity:0;animation:rd103Reveal .9s ease 1.05s forwards}.rd103-step{border-top:1px solid rgba(255,255,255,.15);padding-top:12px}.rd103-n{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.3)}.rd103-t{font-size:11px;margin-top:8px;color:rgba(255,255,255,.65)}
          #rd103-shell footer{border-top:1px solid rgba(243,240,232,.17);padding-top:20px;display:flex;align-items:center;justify-content:space-between;opacity:0;animation:rd103Reveal 1s ease 1.25s forwards}.rd103-enter{font-size:13px;font-weight:500}.rd103-touch{font-size:10px;margin-top:6px;color:rgba(255,255,255,.3)}.rd103-arrow{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;animation:rd103Arrow 2.7s ease-in-out infinite}
          #rd103-shell svg{position:absolute;right:-45px;top:112px;width:310px;height:355px}.rd103-line{fill:none;stroke:rgba(243,240,232,.105);stroke-width:1;stroke-dasharray:900;stroke-dashoffset:900;animation:rd103Draw 3.2s ease forwards}.rd103-accent{stroke:rgba(243,240,232,.31);animation-delay:.35s}
          #intro .rd94-photo-cta{position:absolute!important;z-index:80!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;visibility:visible!important;opacity:0!important;pointer-events:auto!important}
          @keyframes rd103Reveal{to{opacity:1;transform:translateY(0)}}@keyframes rd103Draw{to{stroke-dashoffset:0}}@keyframes rd103Glow{from{transform:translate(-15px,-15px) scale(.9);opacity:.55}to{transform:translate(25px,28px) scale(1.18);opacity:1}}@keyframes rd103Float{50%{transform:translate(18px,-25px)}}@keyframes rd103Arrow{50%{transform:translate(4px,-4px)}}
          @media(max-width:360px){#rd103-shell{padding-left:22px;padding-right:22px}#rd103-shell h1{font-size:43px}}
          @media(prefers-reduced-motion:reduce){#rd103-shell *{animation:none!important;opacity:1!important;transform:none!important}.rd103-line{stroke-dashoffset:0!important}}
          </style>'''
          body='''<div id="rd103-shell"><div class="glow"></div><div class="orb"></div><svg viewBox="0 0 310 355" aria-hidden="true"><path class="rd103-line" d="M38 320V118L155 36l116 82v202M77 320V143l78-55 78 55v177M116 320V190h78v130"/><path class="rd103-line rd103-accent" d="M38 118L155 36l116 82"/></svg><div class="content"><header><div class="brand"><div class="rd103-logo">R</div><div><div class="brandname">RénoDirect</div><div class="rd103-sub">Rénovation simplifiée</div></div></div><div style="font-size:10px;color:rgba(255,255,255,.35)">01</div></header><div class="main"><div class="rd103-eye">PROJET · EXPERTISE · CONFIANCE</div><h1>Rénover,<br><span class="rd103-serif">sans compromis.</span></h1><div class="copy">Votre projet. Des professionnels qualifiés. Une expérience pensée pour avancer simplement.</div></div><div class="steps"><div class="rd103-step"><div class="rd103-n">01</div><div class="rd103-t">Décrivez</div></div><div class="rd103-step"><div class="rd103-n">02</div><div class="rd103-t">Comparez</div></div><div class="rd103-step"><div class="rd103-n">03</div><div class="rd103-t">Réalisez</div></div></div><footer><div><div class="rd103-enter">Entrer dans RénoDirect</div><div class="rd103-touch">Touchez n’importe où</div></div><div class="rd103-arrow">↗</div></footer></div></div>'''
          s=s.replace('</head>',head+'</head>',1)
          needle='<div id="intro"'
          i=s.find(needle)
          if i<0: raise SystemExit("intro missing")
          gt=s.find('>',i)
          s=s[:gt+1]+body+s[gt+1:]
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Install premium animated RenoDirect intro"
          git push
