name: Clean role screen legacy
on:
  push:
    paths:
      - '.github/workflows/clean-role-legacy.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy role overlays and keep direct navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text()
          original=s
          s=re.sub(r'<script id="rd106-role-premium-runtime">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<style id="rd106[^"]*">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<style id="rd107[^"]*">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<style id="rd108[^"]*">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<style id="rd109[^"]*">.*?</style>', '', s, flags=re.S)
          required=['id="rd110-choice-design"','href="#client"','href="#pro1"','href="#loginClient"','href="#loginPro"']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Missing required new UI/navigation: "+str(missing))
          p.write_text(s)
          print("Removed legacy bytes:",len(original)-len(s))
          PY
      - name: Commit clean screen
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove legacy role overlay and use direct form actions"
          git push origin main
