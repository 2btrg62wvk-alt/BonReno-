name: Fix Project Publish Source
'on':
  push:
    paths:
      - '.github/workflows/fix-project-publish-source.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          old="var d=(window.RD72&&RD72.data)||{};"
          new="var d=window.RD74DATA||{};"
          if old not in s: raise SystemExit("RD72.data source not found")
          s=s.replace(old,new,1)
          s=s.replace('id="rd72Publish" href="#clientProjectsPublished"','id="rd72Publish" href="#clientProjects"',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix project publish data source and destination"
          git push
