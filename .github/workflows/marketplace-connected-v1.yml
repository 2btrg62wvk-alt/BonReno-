name: Connect client and contractor marketplace
on:
  push:
    paths: ['.github/workflows/marketplace-connected-v1.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply authenticated marketplace
        run: |
          python3 - <<'PYCODE'
          import base64,io,tarfile
          payload=''
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(payload)),mode='r:gz') as tar:
              tar.extractall('.',filter='data')
          PYCODE
          git apply marketplace.patch
          rm marketplace.patch
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js -o app/supabase-2.117.2.js
          echo "59d39487c3589843b410322d8a3d562ce022aba1e5ccb16898ef3fb2a0da2ecd  app/supabase-2.117.2.js" | sha256sum -c -
          npm ci --ignore-scripts
          node --check app/marketplace.js
          npm test
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html app database tests README.md package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Connect authenticated marketplace with trade matching, quotes and acceptance'
          git push
