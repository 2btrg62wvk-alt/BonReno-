name: Fix My Projects Data
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-my-projects-data.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bindings
        run: python3 -c "from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');m='</body></html>';x='<script id=\"rd85-my-projects-sync\">(function(){function q(i,v,f){var e=document.getElementById(i);if(e)e.textContent=v||f||\"\"}function r(){var p=null;try{p=JSON.parse(localStorage.getItem(\"rd83PublishedProject\")||\"null\")}catch(e){}if(!p)return;var t=p.name||p.title||p.type||\"Mon projet\",l=[p.city,p.postal].filter(Boolean).join(\" · \");q(\"rd84CardType\",t,\"Mon projet\");q(\"rd84CardDesc\",p.description,\"Projet publié avec succès.\");q(\"rd84CardBudget\",p.budget,\"Budget à confirmer\");q(\"rd84CardTiming\",p.timing,\"Échéancier à confirmer\");q(\"rd84CardLocation\",l,\"Votre secteur\")}if(document.readyState===\"loading\")document.addEventListener(\"DOMContentLoaded\",r);else r();window.addEventListener(\"hashchange\",r);var b=document.getElementById(\"rd72Publish\");if(b)b.addEventListener(\"click\",function(){setTimeout(r,0)})})();</script>';assert m in s;s=s if 'rd85-my-projects-sync' in s else s.replace(m,x+m,1);p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix published project data in My Projects"
          git push
