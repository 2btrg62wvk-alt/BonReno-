name: Fix home menu position
on:
  push:
    paths: ['.github/workflows/home-menu-position.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Fix viewport positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-home-menu-position-fix">
          body:has(#clientDashboard:target) main.app,body:has(#contractorFeed:target) main.app{display:none!important}
          #clientDashboard#clientDashboard,#contractorFeed#contractorFeed{transform:none!important;filter:none!important;backdrop-filter:none!important;contain:none!important}
          </style>'''
          if 'id="rd-home-menu-position-fix"' not in s:
              p.write_text(s.replace('</body>',css+'</body>',1))
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep home menus at top and navigation visible'
          git push
