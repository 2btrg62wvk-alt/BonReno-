name: Install approved screen 2
on:
  push:
    paths:
      - '.github/workflows/install-approved-screen2.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install approved UI preserving routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html"); s=p.read_text()
          start=s.find('<section id="accueil"')
          if start<0: raise SystemExit("accueil missing")
          end=s.find('</section>',start)
          if end<0: raise SystemExit("accueil end missing")
          end+=len('</section>')
          html='''<section id="accueil" class="screen active rd130-choice">
  <div class="rd130-orb rd130-orb-a"></div><div class="rd130-orb rd130-orb-b"></div>
  <div class="rd130-shell">
    <div class="rd130-top"><a class="rd130-back" href="#intro" aria-label="Retour">‹</a><div class="rd130-progress"><b></b><i></i><i></i><i></i></div></div>
    <div class="rd130-eyebrow">CHOISISSEZ VOTRE PROFIL</div>
    <h1>Vous êtes ici pour <em>quoi?</em></h1>
    <p class="rd130-lead">Choisissez votre espace. RénoDirect adaptera l'expérience à votre façon de rénover.</p>
    <div class="rd130-cards">
      <a class="rd130-card rd130-client" href="#client">
        <div class="rd130-icon">⌂</div>
        <div class="rd130-copy"><h2>Je suis client</h2><p>J'ai un projet et je veux trouver les bons professionnels.</p></div>
        <span class="rd130-arrow">→</span>
      </a>
      <a class="rd130-card rd130-pro" href="#pro1">
        <div class="rd130-icon">⌁</div>
        <div class="rd130-copy"><h2>Je suis entrepreneur</h2><p>Je veux découvrir des projets et développer mon entreprise.</p></div>
        <span class="rd130-arrow">→</span>
      </a>
    </div>
    <div class="rd130-existing"><div class="rd130-rule"><span></span><b>DÉJÀ UN COMPTE ?</b><span></span></div><div class="rd130-logins"><a href="#loginClient">Se connecter comme client</a><i></i><a href="#loginPro">Se connecter comme entrepreneur</a></div></div>
  </div>
</section>'''
          s=s[:start]+html+s[end:]
          css='''<style id="rd130-approved-screen2">
#accueil.rd130-choice{min-height:100svh;width:100%;box-sizing:border-box;position:relative;overflow:auto;background:linear-gradient(145deg,#f4f2e9 0%,#ebece3 55%,#f7f5ed 100%);color:#0b281b;font-family:inherit;padding:clamp(24px,4vw,52px) clamp(18px,5vw,70px)}
#accueil.rd130-choice:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,64,46,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(31,64,46,.035) 1px,transparent 1px);background-size:72px 72px;pointer-events:none}
#accueil .rd130-orb{position:absolute;border:1px solid rgba(24,58,40,.18);border-radius:50%;pointer-events:none}
#accueil .rd130-orb-a{width:360px;height:360px;right:-230px;top:180px}#accueil .rd130-orb-b{width:280px;height:280px;left:-190px;bottom:-110px}
#accueil .rd130-shell{position:relative;z-index:1;width:min(1050px,100%);margin:auto}
#accueil .rd130-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(40px,7vh,78px)}
#accueil .rd130-back{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#153a29;background:rgba(255,255,255,.52);border:1px solid rgba(18,51,35,.08);font-size:42px;font-weight:300;box-shadow:0 8px 30px rgba(25,47,35,.06)}
#accueil .rd130-progress{display:flex;gap:9px;margin-right:8px}#accueil .rd130-progress>*{display:block;width:54px;height:6px;border-radius:9px;background:rgba(17,52,34,.15)}#accueil .rd130-progress b{background:#1d5138}
#accueil .rd130-eyebrow{font-size:13px;font-weight:800;letter-spacing:.28em;margin-bottom:18px;color:#345746}
#accueil .rd130-shell>h1{font-size:clamp(48px,7vw,86px);line-height:.9;letter-spacing:-.055em;margin:0;max-width:900px;font-weight:780}
#accueil .rd130-shell>h1 em{display:block;font-family:Georgia,serif;font-weight:400;color:#315e45}
#accueil .rd130-lead{font-size:clamp(17px,2vw,23px);line-height:1.5;max-width:760px;color:#405b4d;margin:24px 0 38px}
#accueil .rd130-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#accueil .rd130-card{position:relative;min-height:300px;border-radius:34px;overflow:hidden;padding:30px;box-sizing:border-box;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;isolation:isolate;box-shadow:0 18px 50px rgba(25,45,34,.11);transition:transform .25s ease,box-shadow .25s ease}
#accueil .rd130-card:hover{transform:translateY(-5px);box-shadow:0 26px 65px rgba(25,45,34,.17)}
#accueil .rd130-card:before{content:"";position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transition:transform .55s ease}
#accueil .rd130-card:hover:before{transform:scale(1.035)}
#accueil .rd130-client:before{background-image:linear-gradient(90deg,rgba(4,30,19,.9),rgba(7,31,20,.48) 56%,rgba(7,25,17,.12)),url("https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&w=1400&q=86")}
#accueil .rd130-pro:before{background-image:linear-gradient(90deg,rgba(4,30,19,.88),rgba(7,31,20,.42) 58%,rgba(7,25,17,.14)),url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1400&q=86")}
#accueil .rd130-icon{position:absolute;top:26px;left:28px;width:68px;height:68px;border:1px solid rgba(255,255,255,.42);background:rgba(28,73,51,.5);backdrop-filter:blur(10px);border-radius:50%;display:grid;place-items:center;font-size:34px}
#accueil .rd130-copy{padding-right:58px}#accueil .rd130-copy h2{font-size:clamp(28px,3vw,40px);letter-spacing:-.035em;margin:0 0 8px}#accueil .rd130-copy p{font-size:17px;line-height:1.45;margin:0;max-width:420px;color:rgba(255,255,255,.88)}
#accueil .rd130-arrow{position:absolute;right:25px;bottom:28px;width:58px;height:58px;border:1px solid rgba(255,255,255,.45);border-radius:50%;display:grid;place-items:center;font-size:30px;background:rgba(9,25,17,.32);backdrop-filter:blur(8px)}
#accueil .rd130-existing{margin:32px auto 0;max-width:760px;padding-bottom:8px}.rd130-rule{display:flex;align-items:center;gap:18px}.rd130-rule span{height:1px;background:rgba(20,53,36,.18);flex:1}.rd130-rule b{font-size:11px;letter-spacing:.25em;color:#536b5e;white-space:nowrap}
#accueil .rd130-logins{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:15px}#accueil .rd130-logins a{color:#173d2b;font-size:14px;font-weight:750;text-underline-offset:4px}#accueil .rd130-logins i{width:1px;height:20px;background:rgba(20,53,36,.2)}
@media(max-width:720px){#accueil.rd130-choice{padding:22px 18px 28px}#accueil .rd130-top{margin-bottom:46px}#accueil .rd130-back{width:46px;height:46px;font-size:34px}#accueil .rd130-progress>*{width:34px;height:5px}#accueil .rd130-shell>h1{font-size:54px}#accueil .rd130-lead{font-size:17px;margin:20px 0 28px}#accueil .rd130-cards{grid-template-columns:1fr;gap:14px}#accueil .rd130-card{min-height:235px;border-radius:28px;padding:24px}#accueil .rd130-icon{width:58px;height:58px;top:21px;left:22px}#accueil .rd130-copy h2{font-size:31px}#accueil .rd130-copy p{font-size:15px}#accueil .rd130-arrow{width:50px;height:50px;right:20px;bottom:21px}#accueil .rd130-existing{margin-top:25px}.rd130-rule{gap:10px}#accueil .rd130-logins{gap:10px;flex-wrap:wrap}#accueil .rd130-logins a{font-size:12px}}
</style>
'''
          if 'id="rd130-approved-screen2"' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          for x in ['href="#client"','href="#pro1"','href="#loginClient"','href="#loginPro"']:
              assert x in html
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install approved role screen with original routes"
          git push origin main
