name: Install RenoDirect app icon
on:
  push:
    paths: ['.github/workflows/install-app-icon.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Install image processing dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Install selected icon and app metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,json
          data=''
          im=Image.open(BytesIO(base64.b64decode(data))).convert('RGB')
          folder=Path('icons');folder.mkdir(exist_ok=True)
          for size,name in [(180,'apple-touch-icon-v1.png'),(192,'icon-192-v1.png'),(512,'icon-512-v1.png')]:
              im.resize((size,size),Image.Resampling.LANCZOS).save(folder/name,optimize=True)
          manifest={"id":"/","name":"RénoDirect","short_name":"RénoDirect","lang":"fr-CA","start_url":"/","scope":"/","display":"standalone","background_color":"#f3f2e9","theme_color":"#e0cdb0","icons":[{"src":"/icons/icon-192-v1.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"/icons/icon-512-v1.png","sizes":"512x512","type":"image/png","purpose":"any"}]}
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          p=Path('index.html');s=p.read_text()
          s=s.replace('<title>Prototype inscription</title>','<title>RénoDirect</title>',1)
          tags='''<!-- RénoDirect home-screen icon -->
          <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v1.png">
          <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-v1.png">
          <link rel="manifest" href="/manifest.webmanifest">
          <meta name="apple-mobile-web-app-title" content="RénoDirect">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="theme-color" content="#e0cdb0">
          '''
          if '<!-- RénoDirect home-screen icon -->' not in s:s=s.replace('</head>',tags+'</head>',1)
          p.write_text(s)
          
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html manifest.webmanifest icons
          git diff --cached --quiet && exit 0
          git commit -m 'Add selected sandstone RD app icon and web app metadata'
          git push
