name: Replace rd110 role screen correctly
on:
  push:
    paths: ['.github/workflows/replace-rd110-correctly.yml']
permissions: {contents: write}
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Replace visible rd110 role section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          # Find actual visible role UI by its rd110 cards, then enclosing section.
          marker='class="rd110-card"'
          m=s.find(marker)
          if m<0: raise SystemExit('rd110 card not found')
          start=s.rfind('<section',0,m)
          end=s.find('</section>',m)
          if start<0 or end<0: raise SystemExit('enclosing section not found')
          end+=10
          old=s[start:end]
          if 'Je suis client' not in old or 'Je suis entrepreneur' not in old: raise SystemExit('wrong section')
          import re
          secid=re.search(r'id="([^"]+)"',old)
          sid=secid.group(1) if secid else 'accueil'
          html=f'''<section id="{sid}" class="screen active rd160-role">
          <div class="rd160-circle rd160-c1"></div><div class="rd160-circle rd160-c2"></div>
          <div class="rd160-wrap">
            <div class="rd160-top"><button class="rd160-back" type="button" onclick="history.back()">‹</button><div class="rd160-steps"><b></b><i></i><i></i><i></i></div></div>
            <div class="rd160-kicker">CHOISISSEZ VOTRE PROFIL</div>
            <h1>Vous êtes ici pour <em>quoi?</em></h1>
            <p class="rd160-lead">Choisissez votre espace. RénoDirect adaptera l'expérience à votre façon de rénover.</p>
            <div class="rd160-grid">
              <a class="rd160-card client" href="#client"><span class="rd160-icon">⌂</span><span class="rd160-copy"><strong>Je suis client</strong><small>J'ai un projet et je veux trouver<br>les bons professionnels.</small></span><span class="rd160-go">→</span></a>
              <a class="rd160-card pro" href="#pro1"><span class="rd160-icon">♙</span><span class="rd160-copy"><strong>Je suis entrepreneur</strong><small>Je veux découvrir des projets et<br>développer mon entreprise.</small></span><span class="rd160-go">→</span></a>
            </div>
            <div class="rd160-account"><div><span></span><b>DÉJÀ UN COMPTE ?</b><span></span></div><nav><a href="#loginClient">Se connecter comme client</a><i></i><a href="#loginPro">Se connecter comme entrepreneur</a></nav></div>
          </div></section>'''
          s=s[:start]+html+s[end:]
          css='''<style id="rd160-role-style">
          .rd160-role{position:relative!important;display:block!important;min-height:100svh!important;width:100%!important;overflow:hidden!important;box-sizing:border-box!important;background:#f3f2e9!important;color:#071b12!important;padding:34px 7vw 44px!important;font-family:Arial,Helvetica,sans-serif!important;background-image:none!important}
          .rd160-role:before,.rd160-role:after{content:none!important}.rd160-wrap{position:relative;z-index:2;width:min(780px,100%);margin:auto}.rd160-top{height:66px;display:flex;align-items:center;justify-content:space-between;margin-bottom:62px}.rd160-back{width:58px;height:58px;border:0;border-radius:50%;background:#f7f6f0;box-shadow:0 7px 24px #20342714;font-size:43px;line-height:1;color:#183c2a}.rd160-steps{display:flex;gap:10px;margin-right:17%}.rd160-steps>*{display:block;width:58px;height:6px;border-radius:9px;background:#d7d7cf}.rd160-steps b{background:#1d5138}.rd160-kicker{font-size:14px;font-weight:800;letter-spacing:.25em;color:#3b594a;margin-bottom:23px}.rd160-role h1{margin:0;font-size:clamp(58px,8vw,84px);line-height:.88;letter-spacing:-.06em;font-weight:800}.rd160-role h1 em{display:block;color:#346149;font:italic 400 1.08em/.95 Georgia,serif}.rd160-lead{font-size:23px;line-height:1.48;color:#42594e;max-width:700px;margin:31px 0 46px}.rd160-grid{display:grid;gap:22px}.rd160-card{position:relative;height:340px;border-radius:42px;overflow:hidden;display:flex;align-items:flex-end;padding:37px 42px;box-sizing:border-box;color:white;text-decoration:none!important;isolation:isolate}.rd160-card:before{content:"";position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}.rd160-card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,30,18,.96),rgba(3,30,18,.72) 48%,rgba(3,30,18,.12))}.rd160-card.client:before{background-image:url('https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&w=1400&q=90')}.rd160-card.pro:before{background-image:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1400&q=90')}.rd160-icon{position:absolute;top:41px;left:42px;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#28523b8c;border:2px solid #ffffff52;font-size:42px;backdrop-filter:blur(8px)}.rd160-copy strong{display:block;font-size:46px;line-height:1;letter-spacing:-.045em;margin-bottom:17px}.rd160-copy small{display:block;font-size:22px;line-height:1.4;color:#ffffffe6}.rd160-go{position:absolute;right:38px;bottom:38px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:2px solid #ffffff66;background:#0a19114d;font-size:40px}.rd160-account{margin:47px 27px 0}.rd160-account>div{display:flex;align-items:center;gap:24px}.rd160-account>div span{height:1px;background:#183b292d;flex:1}.rd160-account>div b{font-size:12px;letter-spacing:.26em;color:#50665a}.rd160-account nav{display:flex;justify-content:center;align-items:center;gap:27px;margin-top:24px}.rd160-account nav a{color:#173a29;font-size:16px;font-weight:700;text-underline-offset:5px}.rd160-account nav i{height:29px;width:1px;background:#183b2940}.rd160-circle{position:absolute;border:1px solid #244b352c;border-radius:50%}.rd160-c1{width:380px;height:380px;right:-270px;top:-155px}.rd160-c2{width:320px;height:320px;left:-240px;bottom:-210px}
          @media(min-width:900px){.rd160-wrap{width:min(1050px,100%)}.rd160-grid{grid-template-columns:1fr 1fr}.rd160-card{height:390px}}
          @media(max-width:620px){.rd160-role{padding:23px 23px 30px!important;overflow:auto!important}.rd160-top{margin-bottom:43px;height:54px}.rd160-back{width:48px;height:48px;font-size:35px}.rd160-steps{margin-right:6%;gap:7px}.rd160-steps>*{width:36px;height:5px}.rd160-kicker{font-size:10px;margin-bottom:17px}.rd160-role h1{font-size:51px}.rd160-lead{font-size:17px;margin:23px 0 30px}.rd160-grid{gap:15px}.rd160-card{height:252px;border-radius:29px;padding:24px}.rd160-icon{top:24px;left:24px;width:63px;height:63px;font-size:31px}.rd160-copy strong{font-size:31px;margin-bottom:9px}.rd160-copy small{font-size:15px;padding-right:43px}.rd160-go{width:55px;height:55px;right:21px;bottom:23px;font-size:30px}.rd160-account{margin:29px 6px 0}.rd160-account>div{gap:11px}.rd160-account>div b{font-size:9px}.rd160-account nav{gap:11px;margin-top:16px;flex-wrap:wrap}.rd160-account nav a{font-size:11.5px}.rd160-account nav i{height:19px}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          print('replaced section id',sid,'old bytes',len(old))
          PY
      - name: Commit
        run: |
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Replace actual rd110 role selection screen"
          git push origin main
