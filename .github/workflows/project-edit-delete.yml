name: Project Edit Delete
'on':
  push:
    paths:
      - '.github/workflows/project-edit-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          code="""<style id="rd90-single-intro-cta">
#intro .rd43-hotspot{display:none!important;pointer-events:none!important}
#intro .intro-actions.single-entry{display:none!important;visibility:hidden!important;pointer-events:none!important}
</style>"""
          if 'id="rd90-single-intro-cta"' not in s:s=s.replace('</head>',code+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate Discover RenoDirect CTA"
          git push

