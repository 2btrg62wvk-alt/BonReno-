name: Project Edit Delete
'on':
  push:
    paths:
      - '.github/workflows/project-edit-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          needle="document.documentElement.classList.add('rd74-has-project');"
          repl=needle+"\n   var w=document.getElementById('rd74PublishedWrap');if(w)w.style.display='block';\n   var dp=document.querySelector('#clientDashboard .rd51-project');if(dp)dp.style.display='';\n   var pc=document.querySelector('#clientProjects .rd57-tabs .active b');if(pc)pc.textContent='1';"
          pos=s.find('<script id="rd83-publish-fix">')
          end=s.find('</script>',pos)
          block=s[pos:end]
          if "var w=document.getElementById('rd74PublishedWrap')" not in block:
              block=block.replace(needle,repl,1)
              s=s[:pos]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "RenoDirect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix project publishing after delete"
          git push
