name: Fix service buttons width
on:
  push:
    paths: ['.github/workflows/fix-services-width.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Fit buttons to the form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-services-fit-v1">
          #services#services .service-grid{width:100%!important;max-width:100%!important;min-width:0!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
          #services#services .service-option{min-width:0!important;max-width:100%!important}
          #services#services .service-option label{display:grid!important;grid-template-columns:28px minmax(0,1fr) 12px!important;width:100%!important;max-width:100%!important;min-width:0!important;gap:7px!important;padding:12px 10px!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;box-sizing:border-box!important}
          #services#services .service-icon{width:28px!important;max-width:28px!important}
          #services#services .service-option input:checked+label::after{margin:0!important;width:12px!important}
          @media(max-width:380px){#services#services .service-grid{grid-template-columns:minmax(0,1fr)!important}}
          </style>'''
          if 'id="rd-services-fit-v1"' not in s:
              p.write_text(s.replace('</body>',css+'</body>',1))
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix service buttons overflowing entrepreneur form'
          git push
