name: Finish home menu fit
on:
  push:
    paths: ['.github/workflows/home-menu-final-fit.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Finish viewport fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-home-menu-final-fit">
          #clientDashboard#clientDashboard,#contractorFeed#contractorFeed{padding:0!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-nav,.rd58-nav){top:calc(100dvh - 86px - env(safe-area-inset-bottom))!important;bottom:auto!important}
          #clientDashboard#clientDashboard#clientDashboard .rd51-new strong{color:#fffef6!important}
          #clientDashboard#clientDashboard#clientDashboard .rd57-title-link{color:#234731!important}
          </style>'''
          if 'id="rd-home-menu-final-fit"' not in s:
              p.write_text(s.replace('</body>',css+'</body>',1))
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finish viewport fit and menu contrast'
          git push
