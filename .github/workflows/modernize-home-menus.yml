name: Modernize home menus
on:
  push:
    paths: ['.github/workflows/modernize-home-menus.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Modernize both home menus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          css=r'''<style id="rd-home-menus-v1">
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed){background:radial-gradient(ellipse at 100% 0%,rgba(76,120,89,.13),transparent 48%),linear-gradient(150deg,#f3f2e9,#eceee5)!important;color:#173327!important;overflow:auto!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-client,.rd58-shell){width:100%!important;max-width:480px!important;min-height:100svh!important;margin:auto!important;padding:calc(24px + env(safe-area-inset-top)) 20px calc(112px + env(safe-area-inset-bottom))!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd-menu-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;color:#234731;font-size:17px;font-weight:800;letter-spacing:-.045em}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd-menu-brand small{font-size:9px;font-weight:650;letter-spacing:.10em;text-transform:uppercase;color:#788671}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-head,.rd58-prohead){gap:16px!important;align-items:center!important;margin:0 0 24px!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-head,.rd58-prohead)>div:first-child{min-width:0!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd51-kicker{font-size:10px!important;color:#56705b!important;letter-spacing:.12em!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) h1{font-size:34px!important;line-height:1.08!important;color:#173327!important;margin:10px 0 8px!important;letter-spacing:-.045em!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-head,.rd58-prohead) p{font-size:13px!important;line-height:1.55!important;color:#74806f!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-avatar,.rd58-proavatar){flex:0 0 46px!important;width:46px!important;height:46px!important;display:grid!important;place-items:center!important;border-radius:16px!important;background:#e5ecdd!important;border:1px solid #d4dfca!important;color:#315d40!important;font-size:13px!important;font-weight:750!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd62-switch{display:block!important;width:fit-content!important;max-width:100%!important;background:transparent!important;color:#668064!important;font-size:10px!important;padding:4px 0!important;margin:4px 0!important}
          #clientDashboard#clientDashboard .rd51-new{position:relative!important;display:flex!important;gap:13px!important;padding:22px 18px!important;background:linear-gradient(120deg,#315b3e,#173c29)!important;border-radius:24px!important;color:#fffef6!important;box-shadow:0 12px 28px rgba(30,69,42,.15)!important;margin:0 0 25px!important;overflow:hidden!important}
          #clientDashboard#clientDashboard .rd51-new>span:nth-child(2){min-width:0;flex:1}
          #clientDashboard#clientDashboard .rd51-new strong{font-size:18px!important}
          #clientDashboard#clientDashboard .rd51-new small{font-size:12px!important;line-height:1.5!important;color:#d1dec9!important;margin-top:6px!important}
          #clientDashboard#clientDashboard .rd51-new .rd51-plus{flex:0 0 44px!important;background:rgba(230,240,214,.16)!important;color:#e4edda!important;border:1px solid rgba(236,244,225,.2)!important;border-radius:15px!important}
          #clientDashboard#clientDashboard .rd51-new b{color:#e4edda!important}
          #clientDashboard#clientDashboard .rd51-section{margin-top:22px!important}
          #clientDashboard#clientDashboard .rd51-section-title h2{font-size:19px!important;color:#234731!important}
          #clientDashboard#clientDashboard .rd51-section-title span{background:#e5ecdd!important;color:#56705b!important;font-size:10px!important}
          #clientDashboard#clientDashboard .rd51-project{grid-template-columns:88px minmax(0,1fr)!important;background:#fffef8!important;border:1px solid #e4e8dc!important;border-radius:22px!important;box-shadow:0 7px 24px rgba(30,57,40,.05)!important;color:#233a2a!important}
          #clientDashboard#clientDashboard .rd51-project-copy{min-width:0!important;padding:9px 6px 9px 12px!important}
          #clientDashboard#clientDashboard .rd51-status{color:#62805a!important;font-size:9px!important}
          #clientDashboard#clientDashboard .rd51-project h3{font-size:16px!important;line-height:1.3!important;overflow-wrap:anywhere!important}
          #clientDashboard#clientDashboard .rd51-project p{color:#74806f!important;font-size:12px!important}
          #clientDashboard#clientDashboard .rd51-quick{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;margin:14px 0 24px!important}
          #clientDashboard#clientDashboard .rd51-quick a{padding:19px 15px!important;background:rgba(255,255,250,.9)!important;border:1px solid #e0e6da!important;border-radius:22px!important;box-shadow:0 5px 18px rgba(30,57,40,.03)!important;color:#234731!important}
          #clientDashboard#clientDashboard .rd51-quick span{width:38px;height:38px;display:grid!important;place-items:center!important;border-radius:12px;background:#e8ede1;color:#315d40!important;margin-bottom:14px!important}
          #clientDashboard#clientDashboard .rd51-quick strong{font-size:14px!important}
          #clientDashboard#clientDashboard .rd51-quick small{font-size:12px!important;line-height:1.5!important;color:#74806f!important}
          #clientDashboard#clientDashboard :is(.rd79-activity-item,.rd79-activity-empty){background:rgba(255,255,250,.85)!important;border:1px solid #e0e6da!important;border-radius:20px!important;padding:17px!important;color:#234731!important}
          #clientDashboard#clientDashboard .rd79-activity-empty p{font-size:13px!important;line-height:1.6!important;color:#74806f!important}
          #clientDashboard#clientDashboard .rd79-activity-top strong{font-size:12px!important}
          #clientDashboard#clientDashboard .rd79-activity-copy>b{font-size:14px!important}
          #clientDashboard#clientDashboard .rd79-activity-copy p{font-size:12px!important;line-height:1.5!important}
          #clientDashboard#clientDashboard .rd79-activity-icon{background:#e8ede1!important;color:#315d40!important}
          #contractorFeed#contractorFeed .rd-pro-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 26px}
          #contractorFeed#contractorFeed .rd-pro-shortcuts a{display:block;padding:18px 15px;border-radius:22px;background:rgba(255,255,250,.9);border:1px solid #e0e6da;text-decoration:none;color:#234731;min-width:0}
          #contractorFeed#contractorFeed .rd-pro-shortcuts span{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#e8ede1;color:#315d40;margin-bottom:14px;font-size:22px}
          #contractorFeed#contractorFeed .rd-pro-shortcuts strong{display:block;font-size:14px}
          #contractorFeed#contractorFeed .rd-pro-shortcuts small{display:block;font-size:12px;line-height:1.5;color:#74806f;margin-top:5px}
          #contractorFeed#contractorFeed .rd58-filterbar{gap:12px!important;margin:0 0 15px!important}
          #contractorFeed#contractorFeed .rd58-filterbar span{font-size:19px!important;color:#234731!important}
          #contractorFeed#contractorFeed .rd58-filterbar span b{font-size:11px!important;background:#e5ecdd!important;color:#56705b!important}
          #contractorFeed#contractorFeed .rd58-filterbar a{font-size:12px!important;color:#315d40!important;border:1px solid #d8e2cf!important;padding:9px 12px!important;border-radius:12px!important;white-space:nowrap}
          #contractorFeed#contractorFeed .rd87-empty{padding:28px 20px!important;background:rgba(255,255,250,.85)!important;border:1px dashed #ccd9c3!important;border-radius:22px!important;font-size:13px!important;line-height:1.65!important;color:#74806f!important}
          #contractorFeed#contractorFeed .rd58-job{background:#fffef8!important;border:1px solid #e0e6da!important;border-radius:22px!important;color:#234731!important;box-shadow:0 7px 24px rgba(30,57,40,.05)!important}
          #contractorFeed#contractorFeed .rd58-job h2{font-size:20px!important}
          #contractorFeed#contractorFeed :is(.rd58-desc,.rd58-place){font-size:13px!important;color:#74806f!important}
          #contractorFeed#contractorFeed .rd58-match{background:#e5ecdd!important;color:#56705b!important;font-size:10px!important}
          #contractorFeed#contractorFeed .rd58-why{background:#e7ede0!important;border:1px solid #d8e2cf!important;border-radius:20px!important;padding:18px!important;margin-top:18px!important}
          #contractorFeed#contractorFeed .rd58-why strong{font-size:13px!important;color:#315d40!important}
          #contractorFeed#contractorFeed .rd58-why p{font-size:12px!important;line-height:1.6!important;color:#697767!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-nav,.rd58-nav){position:fixed!important;z-index:60!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;bottom:calc(12px + env(safe-area-inset-bottom))!important;width:calc(100% - 32px)!important;max-width:398px!important;height:74px!important;padding:7px!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;border:1px solid rgba(217,227,207,.85)!important;border-radius:23px!important;background:rgba(255,255,249,.95)!important;box-shadow:0 10px 40px rgba(30,57,40,.13)!important;backdrop-filter:blur(20px)!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-nav,.rd58-nav) a{min-width:0!important;padding:7px 2px!important;font-size:10px!important;font-weight:650!important;color:#74806f!important;gap:5px!important;border-radius:16px!important;white-space:normal!important;text-align:center!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-nav,.rd58-nav) a.active{background:#e5ecdd!important;color:#315d40!important}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-nav,.rd58-nav) svg{width:21px;height:21px;display:block}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) a:focus-visible{outline:3px solid #8fa980;outline-offset:3px}
          :is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd-menu-brand{animation:rdClientIn .4s ease both}
          @media(max-width:360px){:is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) :is(.rd51-client,.rd58-shell){padding-left:14px!important;padding-right:14px!important}#clientDashboard#clientDashboard .rd51-new{padding:18px 14px!important;gap:10px!important}}
          @media(prefers-reduced-motion:reduce){:is(#clientDashboard,#contractorFeed):is(#clientDashboard,#contractorFeed) .rd-menu-brand{animation:none!important}}
          </style>'''
          if 'id="rd-home-menus-v1"' in s:
              raise SystemExit('Already applied')
          icons={
           '#clientDashboard':'<path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/>',
           '#newProject':'<path d="M12 4v16M4 12h16"/>',
           '#clientProjectDetail':'<path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/>',
           '#clientMessages':'<path d="M4 4h16v12H9l-5 4zM8 8h8M8 12h5"/>',
           '#contractorFeed':'<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 7V3h8v4M4 12h16"/>',
           '#contractorQuotes':'<path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/>',
           '#profilePreview':'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'
          }
          for sid,brand in [('clientDashboard','Votre espace'),('contractorFeed','Espace professionnel')]:
              start=s.index('<section class="screen'+(' rd58-proscreen' if sid=='contractorFeed' else '')+'" id="'+sid+'">')
              end=s.index('</section>',start) if sid=='contractorFeed' else s.index('\n\n\n<section class="screen" id="newProject">',start) if '\n\n\n<section class="screen" id="newProject">' in s[start:] else s.index('<section',s.index('</nav>',start))
              # The client screen has nested sections, so delimit by the following screen.
              if sid=='clientDashboard':
                  end=s.index('<section',s.index('</nav>',start))
              part=s[start:end]
              header='<header class="'+('rd51-head' if sid=='clientDashboard' else 'rd58-prohead')+'">'
              part=part.replace(header,'<div class="rd-menu-brand"><span>RénoDirect<span style="color:#9fba8c"> ·</span></span><small>'+brand+'</small></div>\n'+header,1)
              if sid=='contractorFeed':
                  shortcuts='<section class="rd-pro-shortcuts" aria-label="Accès rapides entrepreneur"><a href="#contractorQuotes"><span>◇</span><strong>Mes soumissions</strong><small>Retrouvez vos offres envoyées</small></a><a href="#profilePreview"><span>◎</span><strong>Mon entreprise</strong><small>Consultez votre profil professionnel</small></a></section>'
                  part=part.replace('<div class="rd58-filterbar">',shortcuts+'\n<div class="rd58-filterbar">',1)
                  part=part.replace('<span>Pour vous <b id="rd87MatchCount">','<span>Projets pour vous <b id="rd87MatchCount">',1)
                  part=part.replace('<nav class="rd58-nav">','<nav class="rd58-nav" aria-label="Navigation entrepreneur">',1)
              navstart=part.index('<nav class="'+('rd51-nav' if sid=='clientDashboard' else 'rd58-nav')+'"')
              navend=part.index('</nav>',navstart)
              nav=part[navstart:navend]
              def icon(m):
                  href,text=m[1],m[2]
                  path=icons.get(href,icons['#clientMessages'])
                  if sid=='contractorFeed' and 'Messages' in text:path=icons['#clientMessages']
                  svg='<span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></span>'
                  return 'href="'+href+'">'+re.sub(r'<span>.*?</span>',lambda _:svg,text,count=1)
              nav=re.sub(r'href="([^"]+)">(.*?)</a>',lambda m:icon(m)+'</a>',nav,flags=re.S)
              part=part[:navstart]+nav+part[navend:]
              s=s[:start]+part+s[end:]
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s)
          
          PY
          git config user.name 'RenoDirect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Modernize client and entrepreneur home menus'
          git push
