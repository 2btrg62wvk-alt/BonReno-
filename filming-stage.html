<!doctype html><html lang="fr"><meta charset="utf-8"><title>Projeko — tournage isolé</title><style>html,body{margin:0;background:#ededed;font-family:system-ui}header{height:50px;display:flex;justify-content:center;align-items:center;gap:20px}button{padding:8px 20px}iframe{display:block;width:430px;height:800px;border:0;margin:0 auto;background:white}</style><header><button id="start" disabled>Lancer le parcours</button><span id="status">Chargement</span></header><iframe id="film-pane" title="Parcours Projeko"></iframe><script>
fetch('/index.html').then(r=>r.text()).then(html=>{html=html.replace(/<script src="\/app\/supabase-[^"]+"><\/script>/,'<script src="/filming-fixture.js"><\/script>');html=html.replace('</body>','<script src="/filming-director.js"><\/script></body>');document.querySelector('iframe').srcdoc=html;});
window.addEventListener('message',e=>{if(e.data==='filming-ready'){document.querySelector('#start').disabled=false;document.querySelector('#status').textContent='Prêt';}if(e.data==='filming-done')document.querySelector('#status').textContent='Terminé';});
document.querySelector('#start').onclick=()=>{document.querySelector('iframe').contentWindow.postMessage('filming-start','*');document.querySelector('#status').textContent='Capture en cours';};
</script></html>
